services:
  recall:
    build: .
    image: discord-recall:latest
    restart: unless-stopped
    # host networking so 127.0.0.1:20129 (OmniRoute/9router) is reachable and
    # MagicDNS resolves. WEB_HOST pins the UI to loopback on the host; expose it
    # with `tailscale serve` rather than publishing a public port.
    network_mode: host
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/discord_recall.db
      WEB_HOST: 127.0.0.1
      WEB_PORT: ${WEB_PORT:-9879}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      SERVER_IDS: ${SERVER_IDS:-[]}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      LLM_API_KEY: ${LLM_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Scope guard: when set, the app refuses to touch any other guild.
      GUILD_WHITELIST: ${GUILD_WHITELIST:-}
      DIGEST_CHANNELS: ${DIGEST_CHANNELS:-}
      SEND_TELEGRAM: ${SEND_TELEGRAM:-false}
      BACKFILL_DAYS: ${BACKFILL_DAYS:-2}
      DIGEST_DAYS: ${DIGEST_DAYS:-3}
      MAX_MESSAGES: ${MAX_MESSAGES:-600}
      BACKFILL_BATCH_SIZE: ${BACKFILL_BATCH_SIZE:-100}
      BACKFILL_DELAY_SECONDS: ${BACKFILL_DELAY_SECONDS:-1.5}
      SCHEDULE_INTERVAL_SECONDS: ${SCHEDULE_INTERVAL_SECONDS:-21600}
      PACE_BATCH: ${PACE_BATCH:-100}
      PACE_DELAY: ${PACE_DELAY:-2.5}
      PACE_JITTER_EXTRA: ${PACE_JITTER_EXTRA:-1.5}
      PACE_MAX_MESSAGES: ${PACE_MAX_MESSAGES:-1000}
      PACE_MAX_REQUESTS: ${PACE_MAX_REQUESTS:-30}
      RUN_SCHEDULER: ${RUN_SCHEDULER:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - recall-data:/data
volumes:
  recall-data:
