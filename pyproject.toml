[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "discord-recall"
version = "0.1.0"
description = "Personal Discord intelligence system"
requires-python = ">=3.11"
dependencies = [
    "discord.py-self>=2.0",
    "aiosqlite>=0.20",
    "httpx>=0.28",
    "python-telegram-bot>=21.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "loguru>=0.7",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "typer>=0.12",
    "greenlet>=3.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]
web = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
discord-recall = "discord_recall.cli:app"
discord-recall-web = "discord_recall.web.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/discord_recall"]

[dependency-groups]
dev = [
    "asyncpg>=0.31.0",
]
