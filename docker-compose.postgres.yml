services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: discord_recall
      POSTGRES_PASSWORD: discord_recall
      POSTGRES_DB: discord_recall
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discord_recall"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
